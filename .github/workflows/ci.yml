name: CI

on:
  push:
  pull_request:

jobs:
  fount:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fount
          POSTGRES_PASSWORD: fount_test
          POSTGRES_DB: fount_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fount -d fount_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FOUNT_TEST_PGHOST: localhost
      FOUNT_TEST_PORT: '5432'
      FOUNT_TEST_USER: fount
      FOUNT_TEST_PASSWORD: fount_test
    strategy:
      matrix:
        elixir: ['1.18', '1.20']
        otp: ['27']
    defaults:
      run:
        working-directory: packages/fount
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - run: mix local.hex --force
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix deps.unlock --check-unused
      - run: mix compile --warnings-as-errors
      - run: mix test
      - run: mix credo --strict
      - run: mix dialyzer
      - run: mix docs --warnings-as-errors
      - run: mix hex.build

  workspace:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fount
          POSTGRES_PASSWORD: fount_test
          POSTGRES_DB: fount_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fount -d fount_integration"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FOUNT_TEST_PGHOST: localhost
      FOUNT_TEST_PORT: '5432'
      FOUNT_TEST_USER: fount
      FOUNT_TEST_PASSWORD: fount_test
      FOUNT_DATABASE_URL: ecto://fount:fount_test@localhost:5432/fount_integration
      FOUNT_SYSTEM_ONE_SDK_PATH: ${{ github.workspace }}/.ci/system_one_sdk/packages/system_one_sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nshkrdotcom/system_one_sdk
          ref: e757598a89e549274b979f0e77c6a4b2b6667752
          path: .ci/system_one_sdk
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20'
          otp-version: '29'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: mix local.hex --force
      - run: mix setup
      - run: mix format --check-formatted
      - run: mix blitz.workspace format --check-formatted
      - run: mix blitz.workspace lock_check
      - run: mix blitz.workspace compile
      - run: mix test
      - run: mix fount.architecture
      - run: mix blitz.workspace credo --strict
      - run: mix blitz.workspace dialyzer
      - run: mix blitz.workspace docs
      - run: MIX_ENV=test mix ecto.migrate
        working-directory: packages/fount
      - run: MIX_ENV=test mix test integration
        working-directory: packages/fount
      - run: MIX_ENV=test mix test integration
        working-directory: packages/fount_workshop
      - run: MIX_ENV=test mix test integration
        working-directory: packages/fount_run
      - run: MIX_ENV=test mix fount_web.migrate
        working-directory: apps/fount_web
      - run: MIX_ENV=test mix test integration
        working-directory: apps/fount_web
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        working-directory: apps/fount_web/browser
      - run: npm ci
        working-directory: apps/fount_web/browser
      - run: npx playwright install --with-deps chromium
        working-directory: apps/fount_web/browser
      - run: scripts/run_phase06_browser.sh
        env:
          FOUNT_OWNER_ID: browser-owner
          FOUNT_OWNER_TOKEN: browser-owner-token
      - run: FOUNT_PACKAGE_BUILD=1 mix hex.build
        working-directory: packages/fount_run
