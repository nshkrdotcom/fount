<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="Fount Workshop">
  <defs>
    <!-- Background Gradient (Dark Blueprint Obsidian) -->
    <linearGradient id="wsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a10"/>
      <stop offset="40%" stop-color="#0f1622"/>
      <stop offset="75%" stop-color="#141c2c"/>
      <stop offset="100%" stop-color="#05080e"/>
    </linearGradient>

    <!-- Metallic Gold Outer Hex Rim -->
    <linearGradient id="wsGoldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="22%" stop-color="#d97706"/>
      <stop offset="48%" stop-color="#fbbf24"/>
      <stop offset="78%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Inner Precision Glow / Cyan Dial Accent -->
    <linearGradient id="wsCyanGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Forge Amber / Tungsten Radial Gradient -->
    <radialGradient id="forgeGlow" cx="50%" cy="56%" r="48%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="25%" stop-color="#f97316" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#070a10" stop-opacity="0"/>
    </radialGradient>

    <!-- Gear Metal Gradient -->
    <linearGradient id="gearMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="30%" stop-color="#64748b"/>
      <stop offset="70%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Brass / Bronze Drafting Caliper Arm Gradient -->
    <linearGradient id="brassArmLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="75%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="brassArmRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Stylus / Nib Blade Gradients -->
    <linearGradient id="stylusLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="stylusRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Manuscript Sheet Fill Gradient -->
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Aperture / Focus Lens Glow -->
    <radialGradient id="apertureCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="30%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter for Outer Hexagon -->
    <filter id="wsHexShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <!-- Subtle Bloom Filter for Stylus Arc -->
    <filter id="glowBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Hexagon (Pointy-topped, exactly matches Fount brand envelope) -->
  <polygon points="100,12 176,56 176,144 100,188 24,144 24,56"
           fill="url(#wsBg)"
           stroke="url(#wsGoldRim)"
           stroke-width="4.5"
           stroke-linejoin="round"
           filter="url(#wsHexShadow)"/>

  <!-- Inner Hexagon Dial Accent -->
  <polygon points="100,20 169,60 169,140 100,180 31,140 31,60"
           fill="none"
           stroke="url(#wsCyanGlow)"
           stroke-width="1.2"
           stroke-linejoin="round"
           opacity="0.75"/>

  <!-- Workshop Calibrated Vernier / Ticks along Inner Facets -->
  <g stroke="#38bdf8" stroke-width="0.8" opacity="0.4">
    <!-- Top-right facet ticks -->
    <line x1="120" y1="31" x2="122" y2="35"/>
    <line x1="135" y1="40" x2="137" y2="44"/>
    <line x1="150" y1="49" x2="152" y2="53"/>
    <!-- Bottom-right facet ticks -->
    <line x1="150" y1="151" x2="152" y2="147"/>
    <line x1="135" y1="160" x2="137" y2="156"/>
    <line x1="120" y1="169" x2="122" y2="165"/>
    <!-- Bottom-left facet ticks -->
    <line x1="80" y1="169" x2="78" y2="165"/>
    <line x1="65" y1="160" x2="63" y2="156"/>
    <line x1="50" y1="151" x2="48" y2="147"/>
    <!-- Top-left facet ticks -->
    <line x1="50" y1="49" x2="48" y2="53"/>
    <line x1="65" y1="40" x2="63" y2="44"/>
    <line x1="80" y1="31" x2="78" y2="35"/>
  </g>

  <!-- Ambient Workshop Forge Light / Spotlight Cones -->
  <circle cx="100" cy="112" r="64" fill="url(#forgeGlow)"/>

  <!-- Blueprint Coordinate Grid Lines -->
  <g opacity="0.14" stroke="#38bdf8" stroke-width="0.65" stroke-dasharray="2,3">
    <!-- Vertical Centerline Axis -->
    <line x1="100" y1="24" x2="100" y2="176"/>
    <!-- Horizontal Crosshair -->
    <line x1="36" y1="100" x2="164" y2="100"/>
    <!-- 30° / 60° Precision Drafting Angles -->
    <line x1="48" y1="70" x2="152" y2="130"/>
    <line x1="48" y1="130" x2="152" y2="70"/>
  </g>

  <!-- Flank Sprocket Notches (Workshop / Cinematic Frame Registration) -->
  <g fill="#fbbf24" opacity="0.32">
    <!-- Left registration notches -->
    <rect x="36" y="72" width="4.5" height="6.5" rx="1.2"/>
    <rect x="36" y="86" width="4.5" height="6.5" rx="1.2"/>
    <rect x="36" y="100" width="4.5" height="6.5" rx="1.2"/>
    <rect x="36" y="114" width="4.5" height="6.5" rx="1.2"/>
    <rect x="36" y="128" width="4.5" height="6.5" rx="1.2"/>
    <!-- Right registration notches -->
    <rect x="159.5" y="72" width="4.5" height="6.5" rx="1.2"/>
    <rect x="159.5" y="86" width="4.5" height="6.5" rx="1.2"/>
    <rect x="159.5" y="100" width="4.5" height="6.5" rx="1.2"/>
    <rect x="159.5" y="114" width="4.5" height="6.5" rx="1.2"/>
    <rect x="159.5" y="128" width="4.5" height="6.5" rx="1.2"/>
  </g>

  <!-- ==================== BACKGROUND REVISION GEAR WHEEL ==================== -->
  <!-- Gear Ring Body (Precision Mechanism of the Agent Revision Loop) -->
  <g opacity="0.45">
    <!-- Outer Gear Wheel with 12 Cogs -->
    <g fill="url(#gearMetal)" stroke="#090d16" stroke-width="0.8">
      <!-- 12 Cogs positioned symmetrically around circle r=45, cx=100, cy=96 -->
      <rect x="97" y="47" width="6" height="6" rx="1"/>
      <rect x="97" y="139" width="6" height="6" rx="1"/>
      <rect x="51" y="93" width="6" height="6" rx="1"/>
      <rect x="143" y="93" width="6" height="6" rx="1"/>
      <!-- 30° / 60° / 120° / 150° / 210° / 240° / 300° / 330° cogs -->
      <rect x="97" y="47" width="6" height="6" rx="1" transform="rotate(30 100 96)"/>
      <rect x="97" y="47" width="6" height="6" rx="1" transform="rotate(60 100 96)"/>
      <rect x="97" y="47" width="6" height="6" rx="1" transform="rotate(120 100 96)"/>
      <rect x="97" y="47" width="6" height="6" rx="1" transform="rotate(150 100 96)"/>
      <rect x="97" y="47" width="6" height="6" rx="1" transform="rotate(210 100 96)"/>
      <rect x="97" y="47" width="6" height="6" rx="1" transform="rotate(240 100 96)"/>
      <rect x="97" y="47" width="6" height="6" rx="1" transform="rotate(300 100 96)"/>
      <rect x="97" y="47" width="6" height="6" rx="1" transform="rotate(330 100 96)"/>
      <!-- Main Gear Rim -->
      <circle cx="100" cy="96" r="45" fill="none" stroke="url(#wsGoldRim)" stroke-width="3"/>
    </g>
    <!-- Internal Circular Calibration Ring -->
    <circle cx="100" cy="96" r="39" fill="none" stroke="#38bdf8" stroke-width="0.9" stroke-dasharray="3,3"/>
    <!-- Inner Recessed Well -->
    <circle cx="100" cy="96" r="32" fill="#070c14" stroke="#d97706" stroke-width="1.2" opacity="0.8"/>
  </g>

  <!-- ==================== SCREENPLAY MANUSCRIPT FOLIO / ANVIL ==================== -->
  <!-- Layered Screenplay Pages (The Foundation Being Crafted and Revised) -->
  <g transform="translate(0, 10)">
    <!-- Back Page (Shadowed Offset) -->
    <polygon points="68,108 132,108 136,152 64,152"
             fill="#0b111c"
             stroke="#334155"
             stroke-width="1"
             opacity="0.7"/>

    <!-- Front Canonical Manuscript Page -->
    <polygon points="64,112 128,112 136,112 136,144 128,156 64,156"
             fill="url(#sheetGrad)"
             stroke="url(#wsGoldRim)"
             stroke-width="1.4"/>

    <!-- Folded Page Corner (Proof of Draft / Revision Leaf) -->
    <polygon points="128,144 136,144 128,156"
             fill="#fef08a"
             stroke="#b45309"
             stroke-width="0.8"/>

    <!-- Screenplay Formatting Guideline Bars on Sheet (Action, Dialogue, Parenthetical) -->
    <!-- Scene Heading bar -->
    <rect x="72" y="118" width="34" height="2" rx="0.5" fill="#38bdf8" opacity="0.8"/>
    <!-- Action Line bars -->
    <rect x="72" y="123" width="56" height="1.4" rx="0.5" fill="#94a3b8" opacity="0.5"/>
    <rect x="72" y="126.5" width="48" height="1.4" rx="0.5" fill="#94a3b8" opacity="0.4"/>
    <!-- Character Cue bar (Centered) -->
    <rect x="88" y="131" width="24" height="1.8" rx="0.5" fill="#fbbf24" opacity="0.85"/>
    <!-- Parenthetical bar -->
    <rect x="84" y="135" width="32" height="1.3" rx="0.5" fill="#38bdf8" opacity="0.55"/>
    <!-- Dialogue lines -->
    <rect x="78" y="138.5" width="44" height="1.5" rx="0.5" fill="#fef3c7" opacity="0.75"/>
    <rect x="81" y="142" width="38" height="1.5" rx="0.5" fill="#fef3c7" opacity="0.6"/>
  </g>

  <!-- ==================== ARTISAN DRAFTING CALIPERS / COMPASS ==================== -->
  <!-- Master Calipers (Precision Architecture & Measuring Tool) -->
  <g>
    <!-- Top Caliper Brass Head Hinge / Knurled Pivot Mount -->
    <circle cx="100" cy="40" r="8.5" fill="#090d16" stroke="url(#wsGoldRim)" stroke-width="2"/>
    <circle cx="100" cy="40" r="5" fill="url(#brassArmLeft)"/>
    <circle cx="100" cy="40" r="2" fill="#090d16"/>

    <!-- Left Caliper Leg (Articulated arm reaching down to the left margin) -->
    <path d="M96,44 Q76,74 66,104 C62,118 60,134 58,148 L62,148 C64,134 67,120 71,106 Q80,78 98,47 Z"
          fill="url(#brassArmLeft)"
          stroke="#090d16"
          stroke-width="0.8"/>

    <!-- Right Caliper Leg (Articulated arm reaching down to the right margin) -->
    <path d="M104,44 Q124,74 134,104 C138,118 140,134 142,148 L138,148 C136,134 133,120 129,106 Q120,78 102,47 Z"
          fill="url(#brassArmRight)"
          stroke="#090d16"
          stroke-width="0.8"/>

    <!-- Caliper Hardened Steel Needle Tips -->
    <polygon points="57,148 63,148 60,158" fill="#e2e8f0" stroke="#475569" stroke-width="0.5"/>
    <polygon points="137,148 143,148 140,158" fill="#e2e8f0" stroke="#475569" stroke-width="0.5"/>

    <!-- Caliper Cross Adjustment Spindle / Micrometer Thumbwheel Bar -->
    <g opacity="0.9">
      <!-- Threaded Shaft -->
      <line x1="72" y1="84" x2="128" y2="84" stroke="url(#wsGoldRim)" stroke-width="2"/>
      <line x1="72" y1="84" x2="128" y2="84" stroke="#090d16" stroke-width="0.6" stroke-dasharray="1,1"/>
      <!-- Left & Right Stop Nuts -->
      <rect x="74" y="81" width="3" height="6" rx="0.5" fill="#fef08a" stroke="#78350f" stroke-width="0.5"/>
      <rect x="123" y="81" width="3" height="6" rx="0.5" fill="#fef08a" stroke="#78350f" stroke-width="0.5"/>
      <!-- Center Thumbwheel Dial -->
      <circle cx="100" cy="84" r="5" fill="#090d16" stroke="url(#wsGoldRim)" stroke-width="1.5"/>
      <line x1="97" y1="84" x2="103" y2="84" stroke="#38bdf8" stroke-width="1"/>
    </g>
  </g>

  <!-- ==================== CENTRAL REVISION STYLUS & APERTURE LENS ==================== -->
  <!-- Stylus Assembly Suspended Vertically Along Centerline -->
  <g>
    <!-- Upper Stylus Stem / Collet -->
    <path d="M96,48 L104,48 L102,68 L98,68 Z" fill="url(#gearMetal)" stroke="#090d16" stroke-width="0.8"/>

    <!-- Central Cinematic Aperture Core (Visual Lineage to Fount Family Mark) -->
    <circle cx="100" cy="84" r="11" fill="#06090e" stroke="url(#wsGoldRim)" stroke-width="1.8"/>
    <circle cx="100" cy="84" r="8" fill="url(#apertureCore)"/>

    <!-- Camera / Iris Aperture Blades -->
    <g stroke="#06090e" stroke-width="1.1" fill="none" opacity="0.8">
      <path d="M97,77 L105,79"/>
      <path d="M105,79 L106,87"/>
      <path d="M106,87 L100,91"/>
      <path d="M100,91 L94,87"/>
      <path d="M94,87 L95,79"/>
    </g>
    <!-- Lens Highlight Spark -->
    <circle cx="98.5" cy="82" r="1.6" fill="#ffffff" opacity="0.95"/>

    <!-- Lower Stylus / Fountain Pen Nib Blade Body -->
    <!-- Left Nib Blade -->
    <path d="M100,92 L98,92 Q90,110 86,126 L94,128 L100,104 Z"
          fill="url(#stylusLeft)"
          stroke="#090d16"
          stroke-width="0.6"/>

    <!-- Right Nib Blade -->
    <path d="M100,92 L102,92 Q110,110 114,126 L106,128 L100,104 Z"
          fill="url(#stylusRight)"
          stroke="#090d16"
          stroke-width="0.6"/>

    <!-- Nib Inlaid Cyan Deco Facet -->
    <polygon points="100,94 95,108 100,118 105,108"
             fill="#0284c7"
             opacity="0.85"/>
    <polygon points="100,96 97,108 100,114 103,108"
             fill="#38bdf8"
             opacity="0.95"/>

    <!-- Precision Nib Slit (Tine Separation) extending to the writing tip -->
    <line x1="100" y1="116" x2="100" y2="132"
          stroke="#06090e"
          stroke-width="1.2"
          stroke-linecap="square"/>

    <!-- Stylus Tungsten/Iridium Tip Touching the Revision Point -->
    <circle cx="100" cy="132" r="2.2" fill="#fef08a"/>
    <circle cx="100" cy="132" r="4.5" fill="#38bdf8" opacity="0.6" filter="url(#glowBloom)"/>
    <circle cx="100" cy="132" r="1" fill="#ffffff"/>
  </g>

  <!-- ==================== WORKSHOP REVISION ENERGY ARC ==================== -->
  <!-- Circular Dynamic Guidance Arc (The Iteration Orbit) -->
  <path d="M74,70 A42,42 0 0,1 126,70"
        fill="none"
        stroke="url(#wsCyanGlow)"
        stroke-width="1.4"
        stroke-dasharray="4,3"
        stroke-linecap="round"
        opacity="0.75"/>
  <path d="M70,126 A42,42 0 0,0 130,126"
        fill="none"
        stroke="url(#wsCyanGlow)"
        stroke-width="1.4"
        stroke-dasharray="4,3"
        stroke-linecap="round"
        opacity="0.6"/>

  <!-- Precision Cardinal Accent Pips on the Hexagon Inner Boundary -->
  <circle cx="100" cy="22" r="2" fill="#fbbf24"/>
  <circle cx="167" cy="61" r="1.8" fill="#fbbf24"/>
  <circle cx="167" cy="139" r="1.8" fill="#fbbf24"/>
  <circle cx="100" cy="178" r="2" fill="#fbbf24"/>
  <circle cx="33" cy="139" r="1.8" fill="#fbbf24"/>
  <circle cx="33" cy="61" r="1.8" fill="#fbbf24"/>
</svg>
