<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="Fount Probe Logo">
  <defs>
    <!-- Background Gradient (Deep Obsidian Navy) -->
    <linearGradient id="probeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060910"/>
      <stop offset="42%" stop-color="#0d1422"/>
      <stop offset="80%" stop-color="#111a2d"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>

    <!-- Metallic Gold Outer Hex Rim -->
    <linearGradient id="probeGoldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="22%" stop-color="#d97706"/>
      <stop offset="48%" stop-color="#fbbf24"/>
      <stop offset="76%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Inner Precision Glow Accent -->
    <linearGradient id="probeInnerGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Scanner Reticle Cyan Gradient -->
    <linearGradient id="reticleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Sensor Beam Cone Gradient -->
    <linearGradient id="sensorCone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Stylus / Nib Shading Gradients -->
    <linearGradient id="probeNibLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="75%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="probeNibRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Central Focal Core Glow -->
    <radialGradient id="focalCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="25%" stop-color="#67e8f9" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#0284c7" stop-opacity="0.6"/>
      <stop offset="85%" stop-color="#0369a1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>

    <!-- Radar / Sensor Arc Sweep -->
    <radialGradient id="radarSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="probeHexShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Outer Hexagon (Pointy-topped) -->
  <polygon points="100,12 176,56 176,144 100,188 24,144 24,56"
           fill="url(#probeBg)"
           stroke="url(#probeGoldRim)"
           stroke-width="4.5"
           stroke-linejoin="round"
           filter="url(#probeHexShadow)"/>

  <!-- Inner Hexagon Accent Border -->
  <polygon points="100,20 169,60 169,140 100,180 31,140 31,60"
           fill="none"
           stroke="url(#probeInnerGlow)"
           stroke-width="1.2"
           stroke-linejoin="round"
           opacity="0.75"/>

  <!-- Screenplay Script Margins / Cinematic Grid Guides -->
  <g opacity="0.16" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="2,3">
    <!-- Action Line Guide -->
    <line x1="48" y1="52" x2="48" y2="148"/>
    <!-- Dialogue Cue Guides -->
    <line x1="78" y1="42" x2="78" y2="158"/>
    <line x1="122" y1="42" x2="122" y2="158"/>
    <!-- Parenthetical Guide -->
    <line x1="152" y1="52" x2="152" y2="148"/>
  </g>

  <!-- Side Filmstrip Sprocket Perforations (Art Deco Integration) -->
  <g fill="#fbbf24" opacity="0.32">
    <!-- Left perforations -->
    <rect x="36" y="70" width="5" height="7" rx="1.5"/>
    <rect x="36" y="84" width="5" height="7" rx="1.5"/>
    <rect x="36" y="98" width="5" height="7" rx="1.5"/>
    <rect x="36" y="112" width="5" height="7" rx="1.5"/>
    <rect x="36" y="126" width="5" height="7" rx="1.5"/>

    <!-- Right perforations -->
    <rect x="159" y="70" width="5" height="7" rx="1.5"/>
    <rect x="159" y="84" width="5" height="7" rx="1.5"/>
    <rect x="159" y="98" width="5" height="7" rx="1.5"/>
    <rect x="159" y="112" width="5" height="7" rx="1.5"/>
    <rect x="159" y="126" width="5" height="7" rx="1.5"/>
  </g>

  <!-- Probe Inspection Light Cone / Sensor Projector Beam -->
  <polygon points="100,28 154,152 46,152"
           fill="url(#sensorCone)"/>

  <!-- Optical Inspection Loupe / Radar Reticle Assembly -->
  <!-- Outer Calibration Dial Ring -->
  <circle cx="100" cy="100" r="48"
          fill="none"
          stroke="#0284c7"
          stroke-width="0.8"
          stroke-dasharray="3,3"
          opacity="0.45"/>

  <!-- Mid Sensor Reticle Ring -->
  <circle cx="100" cy="100" r="36"
          fill="none"
          stroke="url(#reticleGrad)"
          stroke-width="1.4"
          opacity="0.75"/>

  <!-- Inner High-Precision Ring -->
  <circle cx="100" cy="100" r="24"
          fill="none"
          stroke="#38bdf8"
          stroke-width="1.0"
          stroke-dasharray="5,2"
          opacity="0.85"/>

  <!-- Radar Scan Area -->
  <circle cx="100" cy="100" r="36"
          fill="url(#radarSweep)"/>

  <!-- Reticle Crosshairs with Precision Spans -->
  <!-- Horizontal Crosshair -->
  <line x1="50" y1="100" x2="88" y2="100" stroke="#38bdf8" stroke-width="1.2" opacity="0.8"/>
  <line x1="112" y1="100" x2="150" y2="100" stroke="#38bdf8" stroke-width="1.2" opacity="0.8"/>
  <!-- Vertical Crosshair -->
  <line x1="100" y1="50" x2="100" y2="88" stroke="#38bdf8" stroke-width="1.2" opacity="0.8"/>
  <line x1="100" y1="112" x2="100" y2="150" stroke="#38bdf8" stroke-width="1.2" opacity="0.8"/>

  <!-- Precision Calibration Ticks on Reticle -->
  <g stroke="#fbbf24" stroke-width="1" opacity="0.75">
    <!-- North ticks -->
    <line x1="97" y1="64" x2="103" y2="64"/>
    <line x1="98" y1="76" x2="102" y2="76"/>
    <!-- South ticks -->
    <line x1="98" y1="124" x2="102" y2="124"/>
    <line x1="97" y1="136" x2="103" y2="136"/>
    <!-- West ticks -->
    <line x1="64" y1="97" x2="64" y2="103"/>
    <line x1="76" y1="98" x2="76" y2="102"/>
    <!-- East ticks -->
    <line x1="124" y1="98" x2="124" y2="102"/>
    <line x1="136" y1="97" x2="136" y2="103"/>
  </g>

  <!-- Diagonal Target Corner Brackets -->
  <g stroke="#38bdf8" stroke-width="1.4" fill="none" opacity="0.6">
    <path d="M74,78 L74,74 L78,74"/>
    <path d="M126,78 L126,74 L122,74"/>
    <path d="M74,122 L74,126 L78,126"/>
    <path d="M126,122 L126,126 L122,126"/>
  </g>

  <!-- Central Fountain Probe Needle / Stylus Sensor -->
  <!-- Left Probe Tine / Blade -->
  <path d="M100,166 L98.5,166 Q90,140 84,120 C78,102 75,82 76,64 L88,42 L100,42 Z"
        fill="url(#probeNibLeft)"
        opacity="0.92"/>

  <!-- Right Probe Tine / Blade -->
  <path d="M100,166 L101.5,166 Q110,140 116,120 C122,102 125,82 124,64 L112,42 L100,42 Z"
        fill="url(#probeNibRight)"
        opacity="0.92"/>

  <!-- Art Deco Chevron Inlay on Probe Sensor -->
  <path d="M100,52 L86,66 C87,82 92,98 98,114 L100,114 Z"
        fill="#0284c7"
        opacity="0.75"/>
  <path d="M100,52 L114,66 C113,82 108,98 102,114 L100,114 Z"
        fill="#38bdf8"
        opacity="0.6"/>

  <!-- Sensor Bridge Filigree -->
  <path d="M82,64 Q100,50 118,64"
        fill="none"
        stroke="#fef08a"
        stroke-width="1.6"
        stroke-linecap="round"/>
  <path d="M87,74 Q100,64 113,74"
        fill="none"
        stroke="#fef3c7"
        stroke-width="1"
        stroke-linecap="round"
        opacity="0.65"/>

  <!-- Forensic Optical Lens / Focal Breather Core -->
  <circle cx="100" cy="100" r="14" fill="#080d18" stroke="url(#probeGoldRim)" stroke-width="2"/>
  <circle cx="100" cy="100" r="11" fill="url(#focalCore)"/>

  <!-- Camera Aperture / Inspection Diaphragm Blades -->
  <g stroke="#090d16" stroke-width="1.2" fill="none" opacity="0.9">
    <path d="M96,92 L105,95"/>
    <path d="M105,95 L107,104"/>
    <path d="M107,104 L100,108"/>
    <path d="M100,108 L93,104"/>
    <path d="M93,104 L95,95"/>
  </g>

  <!-- Glowing Laser Inspection Center Dot -->
  <circle cx="100" cy="100" r="3.2" fill="#ffffff" opacity="0.98"/>
  <circle cx="100" cy="100" r="1.5" fill="#38bdf8"/>

  <!-- Probe Sensor Slit (Split Tine) running to Ultra-Fine Tip -->
  <line x1="100" y1="114" x2="100" y2="167"
        stroke="#06090e"
        stroke-width="1.4"
        stroke-linecap="square"/>

  <!-- Iridium Sensor Probe Tip with Active Telemetry Glow -->
  <circle cx="100" cy="167" r="2.2" fill="#fef08a"/>
  <circle cx="100" cy="167" r="4.5" fill="#38bdf8" opacity="0.45"/>
  <circle cx="100" cy="167" r="1.0" fill="#ffffff"/>
</svg>
